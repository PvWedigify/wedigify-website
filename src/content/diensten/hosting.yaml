faq:
- vraag: Wat is de beste hosting voor Magento?
  antwoord: >-
    Hosting die gespecialiseerd is in Magento, met de juiste serverconfiguratie, caching en ondersteuning.
    Wij werken daarom met Hypernode, waar we Gold Partner van zijn.
- vraag: Wat kost Magento hosting?
  antwoord: >-
    Dat hangt af van het verkeer, de omvang van je catalogus en de omgevingen die je nodig hebt, zoals
    een staging omgeving. Na een korte analyse adviseren we het passende plan en krijg je een helder voorstel.
- vraag: Kunnen jullie mijn webshop verhuizen zonder downtime?
  antwoord: >-
    We bereiden de verhuizing voor op de nieuwe omgeving, testen alles en plannen de overstap op een rustig
    moment. Zo blijft de impact voor je klanten minimaal.
- vraag: Wat is het verschil met gewone webhosting?
  antwoord: >-
    Gewone webhosting is gemaakt voor eenvoudige websites. Magento heeft meer rekenkracht, specifieke
    software en caching nodig. Managed Magento hosting is daar volledig op ingericht en wordt actief beheerd.
- vraag: Kan ik overstappen van Adobe Commerce Cloud?
  antwoord: >-
    Ja. Veel webshops stappen over naar Magento Open Source op Hypernode en besparen zo flink op licentie
    en hostingkosten. Krale bespaart daarmee €90K per jaar.
- vraag: Blijf ik eigenaar van mijn data?
  antwoord: >-
    Ja. Je webshop, data en code blijven altijd van jou. Wij regelen en beheren de hosting voor je.
