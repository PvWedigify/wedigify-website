watIs:
  titel: Wat is managed Magento hosting?
  tekst: >-
    Magento stelt hoge eisen aan je server: genoeg rekenkracht, de juiste PHP versie, caching met Varnish
    en Redis, en een zoekmachine als OpenSearch. Bij managed Magento hosting hoef jij daar niet over na
    te denken. Wij sluiten de hosting bij Hypernode voor je af, richten de omgeving optimaal in voor jouw
    webshop en houden hem in de gaten.
  punten:
  - Hosting bij Hypernode, gespecialiseerd in Magento
  - Inrichting en tuning voor jouw webshop en verkeer
  - Monitoring, updates en beheer door ons team
  - Eén aanspreekpunt voor webshop en server
