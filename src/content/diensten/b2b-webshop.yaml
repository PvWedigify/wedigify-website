  icoon: koffer
watIs:
  titel: Wat maakt een B2B webshop anders?
  tekst: >-
    In B2B koopt een klant niet één keer, maar structureel. Hij heeft afgesproken prijzen, een eigen assortiment,
    meerdere inkopers en betaalt op rekening. Een goede B2B webshop maakt dat proces makkelijk en koppelt
    alles aan je ERP. Magento is daar sterk in: met Adobe Commerce zijn veel B2B functies standaard aanwezig,
    en op Magento Open Source realiseren we ze met bewezen extensies en maatwerk.
  punten:
  - Klantspecifieke prijzen, staffels en kortingen
  - Eigen assortiment en catalogus per klant of groep
  - Bestellen op rekening, offertes en snel herbestellen
  - Meerdere gebruikers en rollen per bedrijfsaccount
  visual: dashboard
