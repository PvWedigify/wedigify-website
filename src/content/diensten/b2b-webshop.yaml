faq:
- vraag: Heb ik Adobe Commerce nodig voor een B2B webshop?
  antwoord: >-
    Niet per se. Adobe Commerce heeft veel B2B functies standaard, maar kent licentiekosten. Op Magento
    Open Source realiseren we de meeste B2B functionaliteit met extensies en maatwerk. We adviseren op
    basis van je business case.
- vraag: Kan ik B2B en B2C in één Magento webshop combineren?
  antwoord: >-
    Ja. Met aparte storeviews of klantgroepen kun je zakelijke en particuliere klanten bedienen vanuit
    één platform, met eigen prijzen, assortiment en checkout.
- vraag: Kan de B2B webshop gekoppeld worden aan ons ERP?
  antwoord: >-
    Ja. We koppelen onder meer met AFAS, Exact Online en Business Central, en andere ERP systemen via
    de API. Zo komen prijzen, voorraad en orders automatisch overeen.
- vraag: Hoe krijgen we onze klanten zover dat ze online bestellen?
  antwoord: >-
    Met een goede onboarding, voordelen voor online bestellen en betrokkenheid van je buitendienst. Onze
    strategen helpen je bij die adoptie.
- vraag: Wat kost een Magento B2B webshop?
  antwoord: >-
    Dat hangt af van de functionaliteit, het aantal koppelingen en de keuze tussen Open Source en Adobe
    Commerce. Na een kennismaking krijg je een onderbouwde begroting.
- vraag: Hoe lang duurt het bouwen van een B2B webshop?
  antwoord: >-
    Een B2B webshop met ERP koppeling staat meestal binnen enkele maanden live. We werken in sprints,
    zodat je tussentijds resultaten ziet.
