waarom:
  titel: Waarom snel handelen belangrijk is
  tekst: >-
    Een gehackte webshop kan klantgegevens lekken, betalingen omleiden of door Google als onveilig worden
    gemarkeerd. Hoe langer het duurt, hoe groter de schade voor je omzet en je reputatie.


    Onze developers kennen Magento tot in de kern. We vinden de oorzaak, herstellen je shop en adviseren
    over structureel onderhoud zodat je niet opnieuw in deze situatie belandt.
