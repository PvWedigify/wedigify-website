faq:
- vraag: Hoe snel kunnen jullie helpen?
  antwoord: >-
    Bel ons direct, dan kijken we meteen mee. Bij bestaande supportklanten gelden de afgesproken reactietijden.
- vraag: Hoe voorkom ik dat mijn webshop opnieuw wordt gehackt?
  antwoord: >-
    Door security patches tijdig te installeren, extensies actueel te houden en toegang goed te beheren.
    Na herstel krijg je een rapport met de oorzaak en concrete maatregelen.
- vraag: Helpen jullie ook als we geen klant zijn?
  antwoord: >-
    Ja. Ook als je webshop door een andere partij wordt beheerd, kunnen we bij een storing of hack direct
    helpen.
- vraag: Wat hebben jullie nodig om te starten?
  antwoord: >-
    Toegang tot de server of hosting, de Magento admin en bij voorkeur de code repository. Weet je niet
    waar je dat vindt, dan helpen we je.
