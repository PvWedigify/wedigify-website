waarom:
  titel: Eenmalige en terugkerende kosten
  tekst: >-
    Eenmalig betaal je voor ontwerp, development, koppelingen, migratie en de livegang. Dat is de investering
    om je webshop neer te zetten.


    Daarna zijn er terugkerende kosten: hosting, licenties van extensies, security patches en updates,
    support en doorontwikkeling. Kies je voor Adobe Commerce, dan komt daar een jaarlijkse licentie bij
    die afhangt van je omzet. Met Magento Open Source betaal je geen licentiekosten voor het platform
    zelf. Daarom kijken we altijd naar de totale kosten over meerdere jaren, niet alleen naar de bouw.
