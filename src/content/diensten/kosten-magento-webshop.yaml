watIs:
  titel: Waar hangen de kosten van af?
  tekst: >-
    Geen twee Magento webshops zijn hetzelfde. Een merk met een overzichtelijk assortiment heeft andere
    wensen dan een groothandel met klantprijzen en een ERP koppeling. De belangrijkste kostenfactoren
    zijn de hoeveelheid maatwerk, het design, het aantal koppelingen, het aantal winkels en talen, en
    de keuze tussen Magento Open Source en Adobe Commerce.
  punten:
  - 'Ontwerp en UX: standaard thema of volledig eigen design'
  - 'Functionaliteit: standaard Magento, extensies of maatwerk'
  - Koppelingen met ERP, PIM, WMS en marketplaces
  - Data migratie vanaf je huidige platform
  - Aantal storeviews, talen en landen
