intro: >-
  De kosten van een Magento webshop hangen af van je ambities, je assortiment en je processen. Op deze
  pagina zie je waar het budget naartoe gaat, welke kosten eenmalig zijn en welke terugkeren, en hoe wij
  tot een onderbouwde begroting komen.
