faq:
- vraag: Wat kost een Magento webshop?
  antwoord: >-
    Dat hangt af van ontwerp, maatwerk, koppelingen, migratie en de keuze tussen Open Source en Adobe
    Commerce. Na een kennismaking maken we een onderbouwde begroting per onderdeel, zodat je precies weet
    waar je aan toe bent.
- vraag: Is Magento Open Source gratis?
  antwoord: >-
    Ja, voor de software zelf betaal je geen licentie. Je betaalt wel voor de bouw, hosting, extensies
    en onderhoud. Adobe Commerce kent daarnaast een jaarlijkse licentie die afhangt van je omzet.
- vraag: Waarom is Magento duurder dan bijvoorbeeld WooCommerce?
  antwoord: >-
    Magento is gebouwd voor grotere en complexere webshops: grote catalogi, B2B, meerdere winkels en koppelingen.
    Dat vraagt meer van de techniek en de developers, maar levert ook veel meer mogelijkheden en schaalbaarheid
    op.
- vraag: Wat zijn de maandelijkse kosten van een Magento webshop?
  antwoord: >-
    Denk aan hosting, licenties van extensies, security patches en updates, support en doorontwikkeling.
    In onze begroting nemen we deze terugkerende kosten altijd mee.
- vraag: Kan ik de kosten spreiden?
  antwoord: >-
    Ja. Door gefaseerd te werken ga je eerst live met de basis en breid je daarna stap voor stap uit.
    Zo spreid je de investering en verdien je deze sneller terug.
- vraag: Krijg ik een vaste prijs?
  antwoord: >-
    Voor een helder afgebakende scope kunnen we een vaste prijs afspreken. Voor doorontwikkeling werken
    we meestal met sprints of een vast maandbudget.
