watIs:
  titel: Wat houdt Magento support en onderhoud in?
  tekst: >-
    Een webshop is nooit af. Met een vaste supportafspraak heb je een team van Magento developers dat
    je shop kent, storingen oplost, kleine wensen oppakt en zorgt dat updates en patches op tijd gebeuren.
    Jij focust op verkopen, wij op een stabiele en snelle webshop.
