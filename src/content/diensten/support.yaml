uitleg:
- titel: Wat valt onder Magento support?
  tekst: >-
    Denk aan het oplossen van bugs, installeren van patches en updates, monitoring van je webshop en kleine
    doorontwikkelingen. Je werkt met een vast team dat je webshop kent, en je krijgt elke maand inzicht
    in wat er is gedaan.
faq:
- vraag: Werken jullie met een strippenkaart of een vast contract?
  antwoord: >-
    Beide is mogelijk. We stemmen de vorm af op de omvang van je webshop en hoeveel doorontwikkeling je
    verwacht.
- vraag: Wat kost Magento support?
  antwoord: >-
    Dat hangt af van de omvang van je webshop en het aantal uren dat je per maand nodig hebt. We werken
    met vaste maandbundels, zodat je kosten voorspelbaar zijn.
- vraag: Kunnen jullie ook support leveren op een shop die een ander bureau bouwde?
  antwoord: >-
    Ja. We starten met een technische audit, zodat we je shop goed kennen voordat we het onderhoud overnemen.
