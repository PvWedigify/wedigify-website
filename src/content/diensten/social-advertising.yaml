faq:
- vraag: Op welke platforms adverteren jullie?
  antwoord: >-
    Meta (Facebook en Instagram), TikTok, Pinterest en LinkedIn. We kiezen de platforms op basis van je
    doelgroep en product.
- vraag: Maken jullie ook de creatives?
  antwoord: >-
    Ja. Onze contentspecialisten maken advertenties, video’s en visuals, of we werken met jouw beeldmateriaal.
- vraag: Wat is server side tracking?
  antwoord: >-
    Een manier van meten die minder last heeft van adblockers en cookiebeperkingen. Daardoor krijgen de
    platforms betere data en presteren je campagnes beter.
- vraag: Wat is een goed startbudget?
  antwoord: >-
    Dat verschilt per markt en doelgroep. In de strategiefase bepalen we samen een budget waarmee je genoeg
    data opbouwt om te optimaliseren.
ctaIntro: Plan een gesprek. We laten zien hoe social advertising past in jouw groeiplan.
