waarom:
  titel: Waarom social advertising?
  tekst: >-
    Zoekmachines vangen bestaande vraag af. Social media creëren nieuwe vraag. Juist de combinatie zorgt
    voor groei: mensen ontdekken je merk via social en kopen later via Google of direct.


    Wij koppelen social campagnes aan je totale groeiplan, zodat je niet alleen naar de ROAS per platform
    kijkt, maar naar wat het oplevert voor je hele webshop.
