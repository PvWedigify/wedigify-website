faq:
- vraag: Wat levert een business case op?
  antwoord: >-
    Een overzicht per kanaal van de kansen, de benodigde investering en de verwachte opbrengst. Daarmee
    maak je onderbouwde keuzes in budget en prioriteiten.
- vraag: Werken jullie ook met offline kanalen?
  antwoord: >-
    Ja. We kijken naar de hele klantreis, inclusief winkels, beurzen en sales. Juist daar liggen vaak
    kansen voor omnichannel groei.
- vraag: Kunnen jullie onze GA4 inrichting controleren?
  antwoord: >-
    Zeker. Een betrouwbare meting is de basis voor elke strategie. We controleren tracking, conversies
    en e-commerce events en lossen fouten op.
- vraag: Hoe vaak evalueren we?
  antwoord: >-
    Maandelijks bespreken we de resultaten, en elk kwartaal stellen we samen de roadmap en targets bij.
ctaIntro: >-
  Plan een groeisessie. We kijken samen naar je cijfers en laten zien waar de grootste kansen liggen.
