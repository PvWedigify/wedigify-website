waarom:
  titel: Waarom eerst een strategie?
  tekst: >-
    Veel webshops besteden budget aan losse acties: een campagne hier, een nieuwe module daar. Zonder
    plan is niet duidelijk wat werkt en waarom. Een business case dwingt keuzes af en maakt resultaat
    meetbaar.


    Shuz werkte met ons vanuit één groeiplan voor webshop, marketing en data, en verbeterde het netto
    resultaat met 283%.
