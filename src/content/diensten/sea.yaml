faq:
- vraag: Welk budget heb ik nodig voor Google Ads?
  antwoord: >-
    Dat hangt af van je markt, marges en doelen. In de audit rekenen we uit welk budget nodig is om rendabel
    te groeien.
- vraag: Werken jullie met Performance Max?
  antwoord: >-
    Ja, waar het past. We combineren Performance Max met Shopping en Search om controle te houden over
    budget en zoekwoorden.
- vraag: Blijf ik eigenaar van mijn Google Ads account?
  antwoord: Altijd. Het account en alle data blijven van jou. Wij krijgen toegang als beheerder.
- vraag: Hoe rapporteren jullie?
  antwoord: >-
    Via een live dashboard en een maandelijkse evaluatie, met de focus op omzet, ROAS en marge in plaats
    van klikken.
ctaIntro: >-
  Laat je Google Ads account doorlichten. Je krijgt inzicht in waar budget weglekt en waar groeikansen
  liggen.
