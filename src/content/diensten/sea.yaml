watIs:
  titel: Wat is SEA voor webshops?
  tekst: >-
    SEA is adverteren in zoekmachines, zoals Google Ads en Microsoft Ads. Voor webshops gaat het vooral
    om Shopping en Performance Max campagnes, gevoed door een goede productfeed. Wij sturen niet op klikken
    of omzet, maar op rendement: wat blijft er over na advertentiekosten en marge?
