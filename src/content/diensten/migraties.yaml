watIs:
  titel: Wat komt er kijken bij een migratie?
  tekst: >-
    Een migratie is meer dan data overzetten. Je verhuist je producten, klanten en orderhistorie, maar
    ook je SEO waarde, koppelingen en werkprocessen. Wij migreren van Magento 1, Adobe Commerce, WooCommerce,
    Shopify of Lightspeed naar Magento 2, met een plan dat elk risico vooraf benoemt.
  punten:
  - Volledige data inventarisatie en mapping
  - Redirectplan per URL om je posities te behouden
  - Proefmigraties op een testomgeving
  - Livegang met monitoring en terugvalplan
