uitleg:
- titel: Overstappen naar Magento 2
  tekst: >-
    Magento 1 wordt sinds juni 2020 niet meer ondersteund met beveiligingsupdates. Draai je nog op Magento
    1 of op een sterk verouderde Magento 2 versie, dan is migreren de veiligste route. We zetten data,
    maatwerk en koppelingen over naar een actuele Magento 2 installatie.
- titel: Van Adobe Commerce naar Magento Open Source
  tekst: >-
    Veel webshops betalen voor Adobe Commerce functionaliteit die ze niet gebruiken. Met een featurecheck
    brengen we in kaart wat je echt nodig hebt. Krale bespaart na de overstap €90K per jaar en had de
    investering binnen drie maanden terugverdiend.
- titel: Van WooCommerce, Shopify of Lightspeed naar Magento
  tekst: >-
    Groeit je webshop uit zijn platform? We migreren producten, klanten en orders naar Magento en zorgen
    dat je URL structuur en Google posities behouden blijven.
- titel: Domeinmigratie
  tekst: >-
    Een nieuw domein raakt SEO, advertenties, tracking en integraties. Voor De Bommel coördineerden we
    de complete overstap naar bommelwonen.nl, zonder verlies van organisch verkeer.
faq:
- vraag: Hoe lang duurt een Magento 2 migratie?
  antwoord: >-
    Dat hangt af van de hoeveelheid data, maatwerk en koppelingen. Na de featurecheck krijg je een planning
    met vaste mijlpalen.
- vraag: Blijven mijn klant- en ordergegevens behouden?
  antwoord: >-
    Ja. Producten, klanten, orders en reviews migreren we mee. Alles wordt eerst op een testomgeving gecontroleerd
    voordat de nieuwe webshop live gaat.
- vraag: Verlies ik mijn posities in Google?
  antwoord: >-
    Niet als de migratie goed wordt voorbereid. We crawlen de huidige site, maken een één-op-één redirectplan
    en monitoren Search Console na livegang.
- vraag: Verlies ik functionaliteit als ik van Adobe Commerce afstap?
  antwoord: Dat checken we vooraf in de featurecheck. Wat cruciaal is, behouden of herbouwen we.
