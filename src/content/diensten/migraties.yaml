waarom:
  titel: Waarom migreren naar Magento 2?
  tekst: >-
    Een verouderd platform kost je elke maand geld: in beveiligingsrisico’s, trage pagina’s, dure workarounds
    en gemiste functionaliteit. Een migratie is het moment om dat op te lossen en tegelijk een betere
    basis voor groei neer te zetten.


    Krale stapte met ons over van Adobe Commerce naar Magento Open Source en bespaart daarmee jaarlijks
    €90K aan licentiekosten, met behoud van alle functionaliteit.
