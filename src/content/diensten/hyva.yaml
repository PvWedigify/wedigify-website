waarom:
  titel: Waarom overstappen naar Hyvä?
  tekst: >-
    De standaard Luma frontend is zwaar en traag. Optimaliseren kost veel tijd en levert steeds minder
    op. Hyvä begint opnieuw met een lichte basis, waardoor snelheid niet langer een project is maar de
    standaard.


    Als Hyvä Partner bouwen we Hyvä thema’s en maken we bestaande modules compatibel. Tacstack ging met
    ons binnen 8 weken van design naar een live Hyvä shop, op tijd voor de IWA beurs.
