uitleg:
- titel: Wat is Hyvä?
  tekst: >-
    Hyvä is een frontend-thema voor Magento 2 dat het standaard Luma thema vervangt. Het is gebouwd met
    Tailwind CSS en Alpine.js en laadt een fractie van het JavaScript dat Luma nodig heeft. Het resultaat
    is een webshop die merkbaar sneller is, vooral op mobiel.
- titel: De voordelen van Hyvä voor je webshop
  tekst: >-
    Snellere laadtijden verbeteren je Core Web Vitals, wat helpt voor je posities in Google en voor je
    conversie. UV-Fashions zag na de overstap 15% meer conversie. Daarnaast is Hyvä eenvoudiger te onderhouden,
    waardoor nieuwe functionaliteit sneller en goedkoper live gaat.
- titel: Hyvä Checkout
  tekst: >-
    Naast het thema biedt Hyvä een eigen checkout die sneller en gebruiksvriendelijker is dan de standaard
    Magento checkout. We kijken per webshop of Hyvä Checkout de investering waard is, op basis van je
    huidige afhaakpercentages.
faq:
- vraag: Werken mijn huidige extensies met Hyvä?
  antwoord: >-
    De meeste grote extensies hebben een Hyvä compatibiliteitsmodule. In de audit brengen we precies in
    kaart wat er nodig is en wat we herbouwen.
- vraag: Kan Hyvä ook met Adobe Commerce?
  antwoord: Ja. Hyvä werkt op zowel Magento Open Source als Adobe Commerce.
- vraag: Wat gebeurt er met mijn SEO bij de overstap?
  antwoord: >-
    URL structuur, metadata en structured data nemen we mee. We testen vooraf op staging en monitoren
    na livegang.
- vraag: Welke Hyvä licenties heb ik nodig?
  antwoord: >-
    Het Hyvä thema zelf is sinds november 2025 gratis en open source, onder dezelfde licenties als Magento
    Open Source. Voor aanvullende onderdelen zoals Hyvä Checkout betaal je nog wel een licentie. In de
    scan zetten we op een rij welke onderdelen zinvol zijn voor jouw webshop en wat dat kost.
- vraag: Moet ik voor Hyvä mijn hele webshop opnieuw bouwen?
  antwoord: >-
    Nee. Alleen de frontend wordt vervangen. Je producten, klanten, orders en backend processen blijven
    gewoon in Magento.
