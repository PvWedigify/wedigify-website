waarom:
  titel: Zonder verrassingen updaten
  tekst: >-
    Een upgrade die jaren is uitgesteld, wordt een groot en risicovol project. Daarom adviseren we om
    in kleine, regelmatige stappen te updaten.


    We werken met een vaste procedure: inventarisatie, update op een testomgeving, regressietests van
    de belangrijkste flows en een gecontroleerde livegang. Zo weet je vooraf precies wat je kunt verwachten.
