intro: >-
  Achterlopen op Magento versies maakt elke volgende stap duurder. Wij plannen updates van Magento, PHP
  en extensies, testen ze en zetten ze gecontroleerd live.
wat:
- Versie- en compatibiliteitscheck
- Update van Magento, PHP en extensies
- Regressietests op staging
- Gecontroleerde livegang
specialist: dmytro
uitleg:
- titel: Waarom je Magento actueel houdt
  tekst: >-
    Elke Magento versie heeft een eindige ondersteuning, net als de PHP versie waarop hij draait. Wie
    te lang wacht, krijgt een steeds grotere en duurdere upgrade. Door regelmatig bij te werken blijft
    je webshop veilig, snel en compatibel met nieuwe extensies.
faq:
- vraag: Hoe vaak moet ik Magento updaten?
  antwoord: >-
    We adviseren security patches direct en versie-updates een paar keer per jaar te plannen. Zo blijven
    upgrades klein en voorspelbaar.
- vraag: Hoe lang duurt een Magento upgrade?
  antwoord: >-
    Een kleine update is vaak binnen enkele dagen klaar. Een grote upgrade met veel maatwerk kan enkele
    weken duren. Na de inventarisatie krijg je een concrete planning.
- vraag: Kunnen updates in een onderhoudscontract?
  antwoord: >-
    Ja. Veel klanten combineren updates, security patches en support in één vaste onderhoudsafspraak.
