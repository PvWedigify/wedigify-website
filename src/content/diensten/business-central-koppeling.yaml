watIs:
  titel: Wat doet een Business Central koppeling?
  tekst: >-
    Met een Business Central koppeling wordt je ERP de bron voor artikelen, voorraad en prijzen in Magento,
    en komen webshoporders direct in Business Central terecht. Dat is ideaal voor groothandels en fabrikanten
    met klantspecifieke prijzen en meerdere magazijnen. We koppelen via de API’s van Business Central.
  punten:
  - Artikelen, voorraad en prijzen vanuit Business Central
  - Orders direct als verkooporder in het ERP
  - Klantspecifieke prijzen en kortingen voor B2B
  - Monitoring en foutafhandeling ingebouwd
