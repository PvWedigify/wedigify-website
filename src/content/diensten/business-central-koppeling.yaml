faq:
- vraag: Kan Business Central gekoppeld worden aan Magento 2?
  antwoord: >-
    Ja. Business Central en Magento 2 zijn goed te koppelen. Afhankelijk van je processen kiezen we voor
    een bestaande connector of een maatwerk koppeling via de API.
- vraag: Welke gegevens worden uitgewisseld tussen Magento en Business Central?
  antwoord: >-
    Meestal artikelen, voorraad, prijzen, klanten en orders, en vaak ook facturen en track and trace.
    In de eerste fase bepalen we samen welke data in welke richting gaat.
- vraag: Hoe vaak wordt de data gesynchroniseerd?
  antwoord: >-
    Dat stemmen we af op je processen. Orders gaan vaak direct of binnen enkele minuten door; voorraad
    en prijzen kunnen periodiek of bij elke wijziging worden bijgewerkt.
- vraag: Wat gebeurt er als de koppeling een fout geeft?
  antwoord: >-
    We bouwen logging, herhaalpogingen en meldingen in. Zo zie je direct als er iets misgaat en raken
    er geen orders kwijt.
- vraag: Werkt de koppeling ook met Business Central on premise?
  antwoord: >-
    Dat is meestal mogelijk, afhankelijk van hoe je omgeving bereikbaar is. In de eerste fase bekijken
    we samen met je ERP partner wat de beste route is.
