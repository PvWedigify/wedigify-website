watIs:
  titel: Wat doet een Exact Online koppeling?
  tekst: >-
    Met een Exact Online koppeling verbind je Magento met je boekhouding en logistiek in Exact Online.
    Webshoporders komen automatisch als verkooporder of factuur in Exact, en artikelen, prijzen en voorraad
    uit Exact worden bijgewerkt in Magento. We maken gebruik van de REST API en webhooks van Exact Online.
