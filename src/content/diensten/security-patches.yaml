watIs:
  titel: Wat zijn Magento security patches?
  tekst: >-
    Adobe brengt regelmatig beveiligingsupdates uit voor Magento. Ze dichten lekken waarmee aanvallers
    betaalgegevens kunnen stelen of je webshop kunnen overnemen. Wij installeren deze patches op tijd,
    testen ze eerst op een aparte omgeving en zetten ze daarna gecontroleerd live.
  punten:
  - Monitoring van nieuwe security releases
  - Testen op een staging omgeving
  - Installatie buiten piekmomenten
  - Controle van modules en afhankelijkheden
