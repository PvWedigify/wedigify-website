waarom:
  titel: Waarom patchen niet kan wachten
  tekst: >-
    Zodra een lek bekend is, zoeken aanvallers automatisch naar webshops die nog niet gepatcht zijn. Een
    achterstand van een paar weken is dan al genoeg om getroffen te worden.


    Met een vaste patchprocedure blijft je shop veilig zonder dat jij er omkijken naar hebt. We combineren
    dit graag met monitoring en support in één onderhoudsafspraak.
