uitleg:
- titel: Waarom security patches zo belangrijk zijn
  tekst: >-
    Magento is een populair doelwit voor aanvallen, omdat webshops betaalgegevens en klantdata verwerken.
    Adobe brengt daarom regelmatig beveiligingsupdates uit. Hoe sneller die zijn geïnstalleerd, hoe kleiner
    het risico op datalekken en skimming.
faq:
- vraag: Kunnen patches mijn webshop breken?
  antwoord: >-
    Daarom testen we elke patch eerst op een testomgeving, inclusief je extensies en maatwerk. Pas als
    alles werkt, gaat de patch live.
- vraag: Hoe vaak komen er security patches uit?
  antwoord: >-
    Adobe brengt meerdere keren per jaar geplande security releases uit, met tussendoor soms een spoedpatch
    voor een kritiek lek.
- vraag: Kan een patch mijn webshop breken?
  antwoord: >-
    Dat kan, vooral bij veel maatwerk of modules van derden. Daarom testen we elke patch eerst op een
    staging omgeving.
