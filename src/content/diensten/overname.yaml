uitleg:
- titel: Zo verloopt een overstap
  tekst: >-
    We starten met een zorgvuldige overdracht van code, toegang en documentatie. Daarna volgt een technische
    audit, zodat we binnen twee weken een helder beeld hebben van de staat van je webshop en de grootste
    risico's en kansen.
faq:
- vraag: Moet ik eerst opzeggen bij mijn huidige bureau?
  antwoord: Nee. We helpen je met een zorgvuldige overdracht, zodat er niets tussen wal en schip valt.
- vraag: Wat als mijn webshop technisch in slechte staat is?
  antwoord: >-
    Dan zie je dat terug in de audit, met een geprioriteerde lijst: eerst stabiliseren, dan verbeteren.
    Zo ging het ook bij Budgetplan, waar de omzetdaling binnen zes weken was omgebogen.
- vraag: Merkt mijn klant iets van de overstap?
  antwoord: >-
    Nee. De overdracht gebeurt op de achtergrond. Je webshop blijft online en we plannen eventuele hostingwijzigingen
    buiten piekmomenten.
- vraag: Wat als mijn huidige bureau niet meewerkt?
  antwoord: >-
    Jij bent eigenaar van je webshop en je code. We helpen je met een lijst van wat je moet opvragen,
    en hebben ervaring met lastige overdrachten.
- vraag: Hoe lang duurt een overname?
  antwoord: >-
    Meestal is de technische overdracht binnen twee tot vier weken rond, inclusief audit en roadmap.
