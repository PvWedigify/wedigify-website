waarom:
  titel: Waarom overstappen?
  tekst: >-
    Trage reacties, onduidelijke facturen of een webshop die niet vooruitkomt: veel webshops blijven te
    lang bij een bureau dat niet meer past. Overstappen voelt spannend, maar met een goede overdracht
    merk je er als klant nauwelijks iets van.


    Budgetplan stapte naar ons over in een moeilijke periode. Binnen 6 weken ging de omzet van een verlies
    van 55% naar een trendbreuk.
