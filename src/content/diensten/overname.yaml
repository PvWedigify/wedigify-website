watIs:
  titel: Hoe werkt een overstap naar Wedigify?
  tekst: >-
    Je wilt van bureau wisselen, maar je webshop moet blijven draaien. Wij nemen de technische overdracht
    van je huidige partij over: toegang, code, hosting en documentatie. Met een technische audit weten
    we binnen enkele weken precies hoe je shop in elkaar zit en wat de prioriteiten zijn.
  punten:
  - Technische audit van code, modules en hosting
  - Overdracht van toegang en repositories
  - Eerlijk advies over wat goed is en wat beter kan
  - Een concrete roadmap voor de komende maanden
