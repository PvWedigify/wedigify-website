uitleg:
- titel: Waarom kiezen voor een Magento webshop?
  tekst: >-
    Magento is gemaakt voor webshops die serieus willen groeien. Grote catalogi, meerdere winkels of talen,
    B2B prijzen en complexe koppelingen zijn standaard mogelijk. Je zit niet vast aan de grenzen van een
    SaaS platform: alles is aan te passen aan jouw processen.
- titel: B2B webshop op Magento
  tekst: >-
    Magento is sterk in B2B: klantspecifieke prijzen en assortimenten, bestellen op rekening, snelle herhaalorders
    en koppelingen met je ERP. Adobe Commerce heeft een uitgebreide B2B module ingebouwd; op Magento Open
    Source realiseren we dit met bewezen extensies en maatwerk.
- titel: Wat kost een Magento webshop laten maken?
  tekst: >-
    De kosten hangen af van het ontwerp, de hoeveelheid maatwerk, het aantal koppelingen en storeviews,
    en of je kiest voor Open Source of Adobe Commerce. Na een groeisessie krijg je een onderbouwde begroting
    per onderdeel, zodat je precies weet waar je in investeert.
faq:
- vraag: Hoe lang duurt het om een Magento webshop te laten maken?
  antwoord: >-
    Dat hangt af van de omvang. Een webshop op Magento met Hyvä kan in enkele maanden live staan; Tacstack
    ging zelfs binnen 8 weken van design naar livegang. In de planning houden we rekening met jouw deadlines.
- vraag: Kies ik voor Magento Open Source of Adobe Commerce?
  antwoord: >-
    Magento Open Source is gratis en voor de meeste webshops ruim voldoende. Adobe Commerce voegt onder
    meer B2B functionaliteit en cloudhosting toe, tegen licentiekosten. We adviseren op basis van je business
    case, niet op basis van wat wij willen verkopen.
- vraag: Magento of Shopify, wat past beter?
  antwoord: >-
    Shopify is snel en eenvoudig voor standaard webshops. Magento is beter als je veel maatwerk, B2B,
    meerdere winkels of complexe koppelingen nodig hebt. In ons kennisartikel zetten we de verschillen
    op een rij.
- vraag: Kan ik de webshop daarna zelf beheren?
  antwoord: >-
    Ja. Producten, content en acties beheer je zelf in de Magento backend. Wij zorgen voor onderhoud,
    updates en doorontwikkeling.
- vraag: Kan ik mijn bestaande data en SEO meenemen?
  antwoord: >-
    Ja. Producten, klanten, orders en content migreren we mee, en met een volledige redirectlijst behoud
    je je posities in Google.
