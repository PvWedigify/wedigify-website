watIs:
  titel: Wat doet een AFAS koppeling?
  tekst: >-
    Met een AFAS koppeling praat je Magento webshop direct met AFAS Profit. Orders uit de webshop komen
    automatisch als verkooporder in AFAS terecht, en artikelen, voorraad en prijzen uit AFAS verschijnen
    zonder handwerk in Magento. De koppeling gebruikt de AFAS Profit connectoren (GetConnectors en UpdateConnectors).
  punten:
  - Orders automatisch als verkooporder in AFAS Profit
  - Artikelen, voorraad en prijzen vanuit AFAS in Magento
  - Debiteuren en klantspecifieke prijsafspraken voor B2B
  - Monitoring en foutafhandeling ingebouwd
