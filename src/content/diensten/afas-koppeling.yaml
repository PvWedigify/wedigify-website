faq:
- vraag: Kan AFAS gekoppeld worden aan Magento 2?
  antwoord: >-
    Ja. AFAS en Magento 2 zijn goed te koppelen. Afhankelijk van je processen kiezen we voor een bestaande
    connector of een maatwerk koppeling via de API.
- vraag: Welke gegevens worden uitgewisseld tussen Magento en AFAS?
  antwoord: >-
    Meestal artikelen, voorraad, prijzen, klanten en orders, en vaak ook facturen en track and trace.
    In de eerste fase bepalen we samen welke data in welke richting gaat.
- vraag: Hoe vaak wordt de data gesynchroniseerd?
  antwoord: >-
    Dat stemmen we af op je processen. Orders gaan vaak direct of binnen enkele minuten door; voorraad
    en prijzen kunnen periodiek of bij elke wijziging worden bijgewerkt.
- vraag: Wat gebeurt er als de koppeling een fout geeft?
  antwoord: >-
    We bouwen logging, herhaalpogingen en meldingen in. Zo zie je direct als er iets misgaat en raken
    er geen orders kwijt.
- vraag: Werkt de koppeling met AFAS Profit in de cloud?
  antwoord: >-
    Ja. De koppeling communiceert via de connectoren van AFAS Profit, die in de AFAS Online omgeving beschikbaar
    zijn.
