uitleg:
- titel: Veelvoorkomende Magento koppelingen
  tekst: >-
    Denk aan ERP systemen zoals AFAS, Exact Online en Microsoft Dynamics 365 Business Central, PIM systemen
    voor productinformatie, WMS- en verzendsoftware, betaalproviders en marketingtools. Via API's laten
    we deze systemen automatisch gegevens uitwisselen met Magento.
- titel: Bestaande connector of maatwerk?
  tekst: >-
    Voor veel systemen bestaat al een koppeling of extensie. Soms is dat de snelste route, soms past maatwerk
    beter bij je processen. We adviseren op basis van betrouwbaarheid, onderhoudskosten en wat je over
    een paar jaar nodig hebt.
faq:
- vraag: Kan Magento gekoppeld worden met AFAS?
  antwoord: >-
    Ja. Via de API's van AFAS en Magento kunnen voorraad, prijzen, orders en klantgegevens automatisch
    worden uitgewisseld, met een bestaande connector of een maatwerkkoppeling.
- vraag: Kan Magento gekoppeld worden met Exact Online of Business Central?
  antwoord: >-
    Ja, beide systemen hebben API's waarmee orders, voorraad en financiële gegevens met Magento worden
    gesynchroniseerd. We kijken welke oplossing het beste past bij jouw situatie.
- vraag: Wat als een koppeling faalt?
  antwoord: >-
    We bouwen monitoring en foutafhandeling in, zodat een probleem wordt gesignaleerd voordat het orders
    of voorraad raakt.
- vraag: Werken jullie met standaard connectors of maatwerk?
  antwoord: >-
    Allebei. Als er een goede standaard connector bestaat, gebruiken we die. Waar dat niet kan of niet
    goed genoeg is, bouwen we een maatwerk koppeling via de API.
- vraag: Wat gebeurt er als een koppeling faalt?
  antwoord: >-
    We bouwen logging, herhaalpogingen en meldingen in. Zo zie je direct als er iets misgaat en raken
    er geen orders kwijt.
