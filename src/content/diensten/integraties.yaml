watIs:
  titel: Wat is een Magento koppeling?
  tekst: >-
    Een koppeling verbindt je Magento webshop met de systemen waarin je bedrijf draait: je ERP, PIM, WMS,
    boekhouding, marketplaces en betaalproviders. Voorraad, prijzen, orders en klantgegevens lopen dan
    automatisch heen en weer, zonder handmatig overtypen.
  punten:
  - Automatische synchronisatie van voorraad en prijzen
  - Orders direct door naar ERP en magazijn
  - Productdata centraal beheerd in je PIM
  - Monitoring en foutafhandeling ingebouwd
  visual: dashboard
