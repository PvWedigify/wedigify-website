uitleg:
- titel: GEO, gevonden worden in AI zoekmachines
  tekst: >-
    Steeds meer klanten stellen hun vraag aan ChatGPT, Perplexity of Gemini, of lezen het AI overzicht
    bovenaan Google. GEO (Generative Engine Optimization) zorgt dat jouw merk en producten daar genoemd
    worden. Dat doen we met heldere, feitelijke content die direct antwoord geeft, complete structured data
    en productfeeds, vermeldingen op betrouwbare bronnen en een technisch toegankelijke webshop. We meten
    hoe vaak je merk in AI antwoorden terugkomt en hoeveel verkeer daaruit komt.
- titel: Technische SEO voor Magento
  tekst: >-
    Magento genereert snel dubbele content via filters, sorteringen en storeviews. We richten canonicals,
    robots-regels, gestructureerde data en de interne linkstructuur zo in dat Google je belangrijkste
    pagina's vindt en waardeert.
- titel: Content op zoekintentie
  tekst: >-
    Categorieën en producten krijgen teksten die aansluiten op wat je klanten zoeken. Zo trek je bezoekers
    die willen kopen, niet alleen bezoekers die rondkijken.
faq:
- vraag: Wat is GEO?
  antwoord: >-
    GEO staat voor Generative Engine Optimization: je webshop zo inrichten dat AI zoekmachines als ChatGPT,
    Perplexity en Google AI Overviews jouw merk en producten noemen en ernaar linken. Het bouwt voort op
    goede SEO, met extra aandacht voor duidelijke antwoorden, structured data en autoriteit.
- vraag: Vervangt GEO gewone SEO?
  antwoord: >-
    Nee. AI zoekmachines halen hun informatie grotendeels uit dezelfde bronnen als Google. Een technisch
    sterke webshop met goede content is de basis voor allebei. Daarom combineren we SEO en GEO in één aanpak.
- vraag: Hoe lang duurt het voordat SEO resultaat oplevert?
  antwoord: >-
    De eerste technische verbeteringen zijn vaak binnen enkele weken zichtbaar. Structurele groei bouw
    je over meerdere maanden op. Greenfield Fashion groeide binnen een jaar met 250% in organische omzet.
- vraag: Doen jullie ook linkbuilding?
  antwoord: >-
    Ja, altijd kwalitatief en relevant voor je branche. We kopen geen linkpakketten in, maar bouwen autoriteit
    via content en samenwerkingen.
- vraag: Wat gebeurt er met mijn SEO bij een migratie?
  antwoord: >-
    Met een volledige redirectlijst, behoud van metadata en monitoring na livegang voorkom je verlies
    van posities. Wij begeleiden dat van begin tot eind.
