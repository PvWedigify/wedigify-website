watIs:
  titel: Wat is SEO voor webshops?
  tekst: >-
    SEO zorgt dat je webshop gevonden wordt op de zoekwoorden waarop je klanten zoeken. Voor webshops
    draait dat om drie dingen: een technisch gezonde site, categorie en productpagina’s die aansluiten
    op zoekintentie, en autoriteit via content en links. Wij combineren die drie met kennis van Magento.
  punten:
  - Technische SEO voor Magento en Hyvä
  - Zoekwoordonderzoek gericht op omzet
  - Optimalisatie van categorie en productpagina’s
  - Content en linkbuilding voor autoriteit
  - Zichtbaar in AI antwoorden (GEO)
