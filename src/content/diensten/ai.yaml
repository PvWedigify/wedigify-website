faq:
- vraag: Is AI geschikt voor mijn webshop?
  antwoord: >-
    In bijna elke webshop zijn processen te vinden waar AI tijd bespaart. In een korte sessie brengen
    we in kaart waar de kansen voor jou liggen.
- vraag: Hoe zit het met privacy en data?
  antwoord: >-
    We kiezen tools en instellingen die passen bij de AVG, en werken waar nodig met geanonimiseerde data.
    Klantgegevens gaan niet zomaar naar externe diensten.
- vraag: Vervangt AI ons team?
  antwoord: >-
    Nee. AI neemt repetitief werk over, zodat je team zich kan richten op werk dat aandacht en expertise
    vraagt. Er blijft altijd een mens die controleert.
- vraag: Wat kost een AI pilot?
  antwoord: >-
    Een pilot houden we bewust klein en overzichtelijk. Na de eerste sessie krijg je een voorstel met
    duidelijke kosten en verwachte opbrengst.
ctaIntro: Plan een AI sessie. We laten zien waar AI in jouw webshop tijd bespaart of omzet oplevert.
