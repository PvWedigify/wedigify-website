watIs:
  titel: Wat kan AI voor je webshop doen?
  tekst: >-
    AI is geen doel op zich, maar een hulpmiddel om tijd te besparen en klanten beter te helpen. Denk
    aan productteksten op schaal, slimmere zoekresultaten, persoonlijke aanbevelingen, klantenservice
    die vragen direct beantwoordt en analyses die patronen in je data zichtbaar maken. Wij passen AI toe
    waar het aantoonbaar waarde toevoegt.
