waarom:
  titel: Waarom nu met AI aan de slag?
  tekst: >-
    De verschillen tussen webshops worden kleiner, en de webshops die AI slim inzetten werken sneller
    en goedkoper. Tegelijk zien we veel experimenten die niets opleveren omdat ze niet aansluiten op processen
    of data.


    Wij beginnen daarom bij je business case: waar kost het nu de meeste tijd of laat je omzet liggen?
    Daar zetten we AI in, gekoppeld aan Magento, je PIM en je marketingtools.
