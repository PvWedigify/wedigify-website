watIs:
  titel: Wat is CRO?
  tekst: >-
    CRO staat voor conversie optimalisatie. Het is het proces waarin je je webshop stap voor stap verbetert,
    zodat meer bezoekers klant worden. Niet door meer verkeer in te kopen, maar door slimmer om te gaan
    met het verkeer dat je al hebt. Elke verbetering is gebaseerd op onderzoek en wordt waar mogelijk
    getest voordat we hem uitrollen.
  punten:
  - Optimaliseren op basis van data, niet op gevoel
  - Gebruikersgedrag analyseren en begrijpen
  - Frictie wegnemen in de customer journey
  - Een betere gebruikerservaring en een hogere conversie
  visual: heatmap
