waarom:
  titel: Waarom CRO?
  tekst: >-
    Veel webshops investeren flink in SEO, SEA en e-mailmarketing om meer bezoekers binnen te halen. Maar
    de webshop zelf blijft vaak onaangeroerd. Zonde, want daar ligt meestal de grootste winst: elke procent
    extra conversie werkt door op al je kanalen tegelijk.


    Door te optimaliseren op gedrag, data en gebruiksvriendelijkheid halen we meer uit elke sessie. Meer
    conversie, een hogere orderwaarde en een lagere acquisitieprijs per klant. Zo groeit je omzet, terwijl
    je marketingbudget gelijk blijft.
