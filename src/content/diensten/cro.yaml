uitleg:
- titel: CRO voor Magento webshops
  tekst: >-
    Magento biedt veel vrijheid, maar elke aanpassing aan checkout, zoekfunctie of productpagina moet
    technisch goed gebouwd worden. Omdat onze CRO specialisten en Magento developers in één team werken,
    gaat een idee zonder overdracht van analyse naar test naar livegang. Dat scheelt weken doorlooptijd
    per experiment.
- titel: A/B testen of direct doorvoeren?
  tekst: >-
    Niet elke verbetering hoeft getest te worden. Duidelijke usability fouten lossen we direct op. Grotere
    veranderingen, zoals een nieuwe productpagina of checkout stap, testen we met een A/B test zodra er
    genoeg verkeer is. Zo bouw je snel resultaat op zonder risico.
- titel: Welke tools gebruiken we?
  tekst: >-
    We werken met Google Analytics 4, heatmaps en sessie opnames, gebruikersonderzoek en A/B testtools
    die passen bij je verkeer en budget. Belangrijker dan de tool is de hypothese: elke test start bij
    een onderbouwd probleem uit de data.
faq:
- vraag: Wat is CRO precies?
  antwoord: >-
    CRO (conversie optimalisatie) is het structureel verbeteren van je webshop zodat meer bezoekers een
    aankoop doen. We combineren data analyse, gebruikersonderzoek en tests om te bepalen wat werkt.
- vraag: Is CRO geschikt voor iedere webshop?
  antwoord: >-
    CRO levert het meeste op als je webshop al een redelijke hoeveelheid bezoekers heeft. Bij weinig verkeer
    richten we ons eerst op de grootste knelpunten en best practices, en starten we met testen zodra er
    genoeg data is.
- vraag: Hoe lang duurt een CRO traject?
  antwoord: >-
    Na een analyse van twee tot drie weken heb je een concrete lijst met verbeteringen. Daarna werken
    we doorlopend aan tests en optimalisaties, meestal per kwartaal gekoppeld aan je groeiplan.
- vraag: Wanneer zie ik resultaat?
  antwoord: >-
    Snelle verbeteringen, zoals het oplossen van fouten in de checkout, zie je vaak binnen enkele weken
    terug. Een A/B test loopt meestal twee tot vier weken om een betrouwbare uitkomst te krijgen.
- vraag: Is CRO een eenmalig project?
  antwoord: >-
    Nee. Bezoekersgedrag, je assortiment en de concurrentie veranderen continu. Daarom werken we met een
    doorlopende testroadmap waarin we steeds de volgende kans oppakken.
- vraag: Wat hebben jullie van ons nodig om te starten?
  antwoord: >-
    Toegang tot je analytics en je Magento omgeving, en inzicht in je doelen en marges. Wij doen de rest:
    van analyse en ontwerp tot development en rapportage.
ctaIntro: >-
