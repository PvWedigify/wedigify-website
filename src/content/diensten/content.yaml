faq:
- vraag: Schrijven jullie ook voor grote assortimenten?
  antwoord: >-
    Ja. Voor grote aantallen producten combineren we templates, AI ondersteuning en redactie door onze
    specialisten, zodat kwaliteit en snelheid samengaan.
- vraag: Maken jullie ook foto’s en video?
  antwoord: Ja, we verzorgen product en sfeerbeelden en korte video’s voor webshop, ads en social.
- vraag: Hoe zorgen jullie dat het in onze tone of voice is?
  antwoord: >-
    We starten met een korte briefing en stijlgids. Na de eerste teksten stemmen we af, daarna schrijven
    we zelfstandig verder.
- vraag: Kunnen jullie content direct in Magento plaatsen?
  antwoord: >-
    Ja. We plaatsen teksten en beelden direct in Magento of in je PIM, inclusief metadata en interne links.
ctaIntro: >-
  Plan een gesprek. We maken een contentplan dat aansluit op je zoekwoorden, doelgroep en groeidoelen.
