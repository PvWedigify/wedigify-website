watIs:
  titel: Wat is contentcreatie voor webshops?
  tekst: >-
    Goede content laat zien waarom iemand bij jou moet kopen. Denk aan productteksten, categorieteksten,
    blogs, koopgidsen, beeld en video. Wij maken content die niet alleen mooi is, maar ook bijdraagt aan
    je vindbaarheid in Google en je conversie op de webshop.
  punten:
  - Product en categorieteksten met SEO focus
  - Blogs en koopgidsen die vragen beantwoorden
  - Beeld en video voor webshop en social
  - Een contentplan gekoppeld aan je groeiplan
