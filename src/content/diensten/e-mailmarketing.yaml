watIs:
  titel: Wat is marketing automation?
  tekst: >-
    Met marketing automation stuur je automatisch de juiste e-mail op het juiste moment: een welkomstreeks,
    een herinnering bij een verlaten winkelwagen, een bedankje na aankoop of een seintje als iemand al
    even niets kocht. Gecombineerd met nieuwsbrieven en segmentatie wordt e-mail een van je meest winstgevende
    kanalen.
  punten:
  - Automatische flows voor de hele klantreis
  - Segmentatie op gedrag en aankoophistorie
  - Koppeling met Magento voor realtime data
  - Templates in je eigen huisstijl
