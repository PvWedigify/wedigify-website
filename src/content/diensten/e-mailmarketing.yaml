waarom:
  titel: Waarom investeren in e-mail?
  tekst: >-
    Je e-maillijst is van jou. Je bent niet afhankelijk van algoritmes of klikprijzen, en je bereikt klanten
    die je merk al kennen. Toch laten veel webshops hier omzet liggen met alleen een af en toe verzonden
    nieuwsbrief.


    Wij bouwen de flows die er echt toe doen, koppelen ze aan je Magento data en optimaliseren ze continu.
    Zo groeit de omzet uit e-mail zonder dat jij er elke week tijd in steekt.
