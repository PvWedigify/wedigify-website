faq:
- vraag: Met welke e-mailplatforms werken jullie?
  antwoord: >-
    Onder andere Klaviyo, ActiveCampaign en Spotler. We adviseren het platform dat past bij je webshop
    en budget, en koppelen het aan Magento.
- vraag: Welke flows leveren het meeste op?
  antwoord: >-
    Meestal de welkomstreeks, verlaten winkelwagen, bekeken producten en de flow na aankoop. Daar beginnen
    we, daarna breiden we uit.
- vraag: Schrijven jullie ook de teksten?
  antwoord: >-
    Ja. Onze contentspecialisten schrijven teksten in je tone of voice en maken de templates in je huisstijl.
- vraag: Hoe zit het met de AVG?
  antwoord: >-
    We werken alleen met contacten die toestemming hebben gegeven, regelen correcte opt-ins en afmeldingen,
    en zorgen dat data veilig wordt verwerkt.
ctaIntro: Plan een gesprek. We laten zien welke flows voor jouw webshop het meeste opleveren.
