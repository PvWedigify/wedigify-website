faq:
  - vraag: Is Magento geschikt voor een fashion webshop?
    antwoord: >-
      Ja. Magento is sterk in producten met veel varianten, grote catalogi, meerdere landen en
      koppelingen met kassa en ERP. Met een Hyvä frontend is de webshop bovendien snel op mobiel,
      waar de meeste modeklanten shoppen.
  - vraag: Kunnen jullie mijn fysieke winkels koppelen aan de webshop?
    antwoord: >-
      Ja. We koppelen Magento aan je kassasysteem en ERP, zodat voorraad, klantdata en orders over
      alle kanalen kloppen. Denk ook aan reserveren in de winkel of retourneren in de winkel.
  - vraag: Hoe verlagen we het aantal retouren?
    antwoord: >-
      Met duidelijke maatinformatie, goede productfoto's en video, reviews met pasvorminformatie en
      data over welke producten vaak terugkomen. In een CRO traject onderzoeken we waar het misgaat.
  - vraag: Kunnen jullie ook de marketing doen?
    antwoord: >-
      Ja. Naast development hebben we specialisten voor SEO, SEA, social advertising, e-mail en CRO.
      Een digitale strateeg brengt alles samen in één plan.
