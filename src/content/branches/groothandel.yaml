naam: Groothandel en industrie
kort: >-
  B2B webshops voor groothandels, fabrikanten en technische leveranciers. Klantprijzen, grote
  catalogi en koppelingen met je ERP.
icoon: koffer
heroTitel: Magento voor groothandel
heroAccent: en industrie.
intro: >-
  Zakelijke klanten bestellen anders dan consumenten. Ze verwachten hun eigen prijzen, snel
  nabestellen op artikelnummer, inkoop op rekening en een webshop die precies weet wat er in je ERP
  staat. We bouwen Magento B2B webshops voor groothandels, fabrikanten en technische leveranciers.
heroPunten:
  - B2B en B2C vanuit één platform
  - Koppelingen met AFAS, Exact en Business Central
  - Grote, technische catalogi overzichtelijk
uitdagingenIntro: >-
  Een B2B webshop is meer dan een webshop met een inlogscherm. Dit zijn de uitdagingen waar
  groothandels en fabrikanten tegenaan lopen.
uitdagingen:
  - icoon: euro
    titel: Klantspecifieke prijzen en afspraken
    tekst: >-
      Elke klant zijn eigen prijsafspraken, staffels, kortingen en assortiment. Dat moet in de webshop
      precies hetzelfde zijn als in je ERP.
  - icoon: database
    titel: Grote, technische catalogi
    tekst: >-
      Duizenden artikelen met specificaties, documentatie en alternatieven. Klanten moeten snel het
      juiste artikel vinden.
  - icoon: team
    titel: Meerdere inkopers per bedrijf
    tekst: >-
      Bedrijfsaccounts met meerdere gebruikers, budgetten, goedkeuringen en inkoop op rekening.
  - icoon: stekker
    titel: Alles hangt aan je ERP
    tekst: >-
      Voorraad, prijzen, orders, facturen en klantdata staan in je ERP. Handmatig overtypen kost tijd en
      leidt tot fouten.
oplossingen:
  - icoon: gebruiker
    titel: Bedrijfsaccounts en eigen prijzen
    tekst: >-
      Klantspecifieke prijzen, assortimenten en kortingen, met meerdere gebruikers en rollen per bedrijf.
  - icoon: winkelwagen
    titel: Snel bestellen
    tekst: >-
      Bestellen op artikelnummer, bestellijsten, eerdere orders herhalen en CSV uploads. Zo bestelt je
      klant in een paar klikken.
  - icoon: stekker
    titel: ERP koppelingen
    tekst: >-
      Betrouwbare koppelingen met AFAS, Exact Online, Business Central en andere systemen, bewaakt en
      onderhouden.
  - icoon: document
    titel: Offertes en documentatie
    tekst: >-
      Offerteaanvragen vanuit de webshop, en technische documentatie, certificaten en datasheets bij elk
      product.
  - icoon: filters
    titel: Zoeken en filteren op specificaties
    tekst: >-
      Filters op technische eigenschappen en een zoekfunctie die artikelnummers en synoniemen begrijpt.
  - icoon: wereld
    titel: Marketplaces en internationaal
    tekst: >-
      Verkopen via marketplaces en in meerdere landen, vanuit één omgeving met één voorraad.
