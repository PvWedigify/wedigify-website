faq:
  - vraag: Is Magento geschikt voor B2B?
    antwoord: >-
      Ja, Magento is een van de sterkste platforms voor B2B. Klantprijzen, bedrijfsaccounts, snel
      bestellen en ERP koppelingen zijn goed te realiseren. Adobe Commerce heeft veel B2B functies
      ingebouwd, en met Magento Open Source realiseer je ze met extensies en maatwerk.
  - vraag: Kunnen B2B en B2C in één webshop?
    antwoord: >-
      Ja. Vanuit één Magento omgeving bedien je zowel consumenten als zakelijke klanten, met eigen
      prijzen, assortiment en checkout per klantgroep.
  - vraag: Met welke ERP systemen kunnen jullie koppelen?
    antwoord: >-
      We hebben veel ervaring met AFAS, Exact Online en Microsoft Dynamics 365 Business Central. Ook
      andere ERP, PIM en WMS systemen koppelen we via hun API.
  - vraag: Hoe lang duurt het bouwen van een B2B webshop?
    antwoord: >-
      Dat hangt af van het aantal koppelingen en de complexiteit van je prijsafspraken. Na een
      kennismaking en analyse geven we je een realistische planning, vaak in fases zodat je snel live
      kunt.
ctaTitel: Je B2B webshop naar een hoger niveau?
volgorde: 3
seoTitel: Magento voor groothandel en industrie (B2B)
seoOmschrijving: >-
  Magento B2B webshop voor groothandels en fabrikanten: klantprijzen, bedrijfsaccounts, snel bestellen
  en koppelingen met AFAS, Exact en Business Central.
