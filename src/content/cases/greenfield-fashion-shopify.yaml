tags: [Migratie, Shopify, SEO]
diensten: [migraties, seo]
hoofdcijfer: SEO behouden
hoofdcijferLabel: Overstap naar Shopify met behoud van organische vindbaarheid.
kort: Greenfield Fashion stapte over van Lightspeed naar Shopify. Klanten, orders en producten gingen mee, en de rankings die we samen hadden opgebouwd bleven staan.
resultaten:
  - waarde: '301'
    label: redirect voor elke oude URL
  - waarde: 60+
    label: merken met varianten overgezet
  - waarde: Klanten
    label: en orderhistorie mee naar Shopify
  - waarde: 3 maanden
    label: live, met stabiele vindbaarheid
uitdaging: >-
  Greenfield Fashion heeft winkels in Waddinxveen en Gouda en verkoopt meer dan
  60 merken. Samen met hen bouwden we de organische omzet flink uit met SEO en
  CRO. Lightspeed werd voor hun ambities te beperkend, dus de keuze viel op
  Shopify. Het risico van zo'n overstap is groot: een platformmigratie is een
  van de snelste manieren om je rankings kwijt te raken. Daarnaast moesten
  vaste klanten hun account en bestelgeschiedenis behouden, en moest de
  productdata met alle maten en kleuren foutloos mee.
aanpak: >-
  We behandelden de migratie als een SEO project met een technische kern.
  Eerst brachten we alle URL's, rankings en verkeer in kaart, daarna
  migreerden we de data in testrondes, en pas toen alles klopte gingen we live.
aanpakPunten:
  - Volledige URL inventarisatie van producten, collecties, merken en content, met een 301 redirect voor elke oude URL
  - Meta titels, omschrijvingen, canonicals en structured data overgezet en gecontroleerd
  - Productdata met varianten in maat en kleur, merken, afbeeldingen en voorraad gemigreerd en gevalideerd
  - Klantaccounts en orderhistorie overgezet, zodat vaste klanten gewoon verder kunnen
  - Shopify thema ingericht met shop the look, merkpagina's en een winkelpagina voor beide winkels
  - Na livegang dagelijks Search Console, 404 meldingen en indexatie gemonitord
resultaat: >-
  Greenfield draait nu drie maanden op Shopify. De organische vindbaarheid is
  behouden, vaste klanten hebben hun gegevens en bestellingen meegenomen en het
  team werkt in een platform dat makkelijker te beheren is. Daarmee ligt er een
  stevig fundament om verder te groeien met SEO en CRO.
functiesTitel: Zo bleef de vindbaarheid overeind.
