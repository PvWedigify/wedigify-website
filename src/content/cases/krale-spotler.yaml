uitdaging: >-
  Krale verkoopt online via de meertalige consumentenshop krale.shop en aan
  dealers via Krale Wholesale. Die klantdata stond los van elkaar. Een jager kreeg
  dezelfde nieuwsbrief als een airsofter die net zijn eerste bestelling deed,
  buitenlandse klanten kregen niet altijd communicatie in hun eigen taal, en
  dealers misten een vast ritme in communicatie. Krale wilde meer
  herhaalaankopen, hogere klantwaarde en relevante communicatie per doelgroep,
  zonder de wettelijke regels rond producten met restricties uit het oog te
  verliezen.
aanpak: >-
  We maakten een framework voor een succesvolle implementatie van Spotler. Spotler
  Connect koppelt de Magento data van B2C en B2B aan Spotler Activate, het
  klantdataplatform. Spotler Mail+ verstuurt de flows en campagnes. Eerst de
  data en consent op orde, dan de basisflows, daarna B2B.
aanpakPunten:
  - Spotler Connect koppelt krale.shop (B2C, meertalig) en Krale Wholesale (B2B) aan Spotler Activate
  - Eén datamodel met per profiel het type klant, de taal, de wereld (schietsport, jacht of airsoft) en de klantwaarde
  - Segmenten per wereld, taal en levensfase, apart voor consumenten en dealers
  - Basisflows in Mail+ voor welkom, verlaten winkelmand en na aankoop, later aanvullen en reactivatie
  - B2B flows voor dealer onboarding en een vast bestelritme
  - Consent per doel en duidelijke afspraken over producten met restricties
resultaat: >-
  Het framework staat en de implementatie loopt in fasen. Elke fase start pas
  als de vorige staat. Samen met Krale leggen we nu de nulmeting en doelen per
  KPI vast. Zodra de eerste flows draaien, delen we hier de resultaten. Een
  logische volgende stap is het koppelen van de winkelaankopen in Staphorst.
