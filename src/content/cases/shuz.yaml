uitdaging: >-
  SHUZ is een familiebedrijf met 16 winkels en een webshop met topmerken als
  Van Bommel en Magnanni. De Magento shop was complex, traag en lastig te
  beheren; prijsaanpassingen en collectie-updates kostten veel tijd en er was
  te weinig grip op data, performance en marketing.
aanpak: >-
  We begonnen met een roadmap waarin techniek en marketing één geheel vormen,
  met meetbare doelen die we continu monitoren en bijsturen.
aanpakPunten:
  - Beheer van de Magento shop vereenvoudigd
  - Snelheid, stabiliteit en schaalbaarheid verbeterd
  - Prijsacties en collectiewissels geautomatiseerd
  - SEO en e-mail versterkt, betaalde campagnes gestuurd op ROAS
  - Wekelijkse rapportage en maandelijkse evaluatie
resultaat: >-
  Het netto resultaat verbeterde met 283,84% en de traffic groeide met
  16,52%. Processen die eerst dagen kostten, verlopen nu foutloos en
  automatisch.
