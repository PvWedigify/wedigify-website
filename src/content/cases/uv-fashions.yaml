uitdaging: >-
  De bestaande Magento 2 frontend was complex, traag en moeilijk te
  onderhouden. De mobiele ervaring voldeed niet meer en de kosten voor
  doorontwikkeling liepen op, in een markt waar snelheid direct conversie is.
aanpak: >-
  Een Hyvä implementatie bovenop de bestaande Magento Open Source installatie,
  in drie fases: analyse en planning, bouw, en uitrol per land.
aanpakPunten:
  - Volledige herbouw van de frontend op Hyvä
  - Responsive redesign met focus op conversie
  - Meertaligheid en valuta voor meerdere landen
  - Bestaande modules en maatwerk geïntegreerd
resultaat: >-
  Een snellere shop met 15% hogere conversie, 20% betere performance en lagere
  onderhoudskosten, binnen de geplande doorlooptijd.
