uitdaging: >-
  Rikkoert Juweliers bestaat 150 jaar en heeft winkels in Schoonhoven en
  Lekkerkerk. Het assortiment is enorm: verlovingsringen, trouwringen,
  horloges, sieraden en vintage stukken. Bij aankopen van honderden tot
  duizenden euro's wil een klant het sieraad eerst passen, voelen en advies
  krijgen. Een webshop die alles naar de online checkout duwt, mist die klant.
  De vraag was dus niet alleen meer online verkopen, maar vooral: hoe zorgt de
  webshop ervoor dat meer mensen met een concreet plan de winkel binnenlopen?
aanpak: >-
  We bouwden een nieuwe webshop op Magento met Hyvä, ontworpen rond de
  klantreis die online begint en in de winkel eindigt. Elke productpagina geeft
  twee volwaardige keuzes: direct bestellen of vrijblijvend reserveren. De
  maatwerk functionaliteit hebben we volledig zelf ontwikkeld en geïntegreerd
  in Magento.
aanpakPunten:
  - Winkelafspraak en reservering, met een eigen reserveerlijst waarin klanten meerdere stukken verzamelen voor één afspraak
  - Winkelvoorraad per vestiging op elke productpagina en in de afspraakmodule, zodat de klant meteen de juiste winkel kiest
  - Gravure als service, machinaal, met de laser of ambachtelijk met de hand, met heldere levertijden
  - Live openingstijden van beide winkels in de header
  - Inspiratieblokken in categorieën als verlovingsringen die uitnodigen tot een afspraak
  - Een snelle Hyvä frontend, belangrijk omdat het grootste deel van de oriëntatie op mobiel gebeurt
resultaat: >-
  De nieuwe webshop is deze week live gegaan. Rikkoert heeft nu een webshop
  die online verkoopt én de winkels vult met voorbereide klanten. We meten
  vanaf de livegang afspraken, reserveringen en online omzet per categorie. Zodra
  de eerste cijfers binnen zijn, delen we ze hier.
