uitdaging: >-
  Krale is sinds 1901 een begrip in schietsport, jacht en airsoft, met een winkel
  van 1.400 m² in Staphorst. Nadat we Krale eerder van Adobe Commerce naar
  Magento Open Source hadden gebracht, was de frontend aan de beurt. Het
  assortiment is groot en technisch, de drie doelgroepen zoeken heel anders en
  voor een deel van de producten gelden wettelijke restricties. Klanten moeten
  dat vooraf weten, zonder dat het de aankoop in de weg zit.
aanpak: >-
  We hebben de webshop opnieuw ontworpen en gebouwd op Hyvä. De structuur
  vertrekt vanuit de drie werelden van Krale, met per wereld een eigen kleur,
  navigatie en snelle routes naar de belangrijkste categorieën.
aanpakPunten:
  - Homepage en navigatie opgedeeld in schietsport, jacht en airsoft, elk met een eigen kleur en categorie ingang
  - Productrestricties duidelijk zichtbaar op de productpagina, zodat de klant vooraf weet wat er geldt
  - Snel zoeken en filteren in een groot, technisch assortiment
  - Meertalige winkel met taal en valuta keuze voor klanten buiten Nederland
  - Gespreid betalen via in3 direct bij de prijs, prettig bij grotere aankopen
  - De fysieke winkel en afhalen prominent in de USP's, naast voor 23:59 besteld, morgen in huis
  - Hyvä voor een snelle frontend, ook op mobiel
resultaat: >-
  Krale heeft een snelle, overzichtelijke webshop die past bij een
  specialist met meer dan 100 jaar ervaring. De volgende stap zetten we nu
  samen: met Spotler Activate en Spotler Mail+ bouwen we een klantdataplatform
  voor zowel de consumentenshop als Krale Wholesale. De groeicijfers van de
  nieuwe webshop delen we hier zodra de eerste periode is afgerond.
