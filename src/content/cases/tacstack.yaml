uitdaging: >-
  Tacstack startte zonder bestaande webshop of technische basis en had een
  vaste deadline: live vóór de internationale vakbeurs IWA OutdoorClassics.
  In acht weken moest er een volwassen platform staan dat professioneel oogt,
  snel laadt, schaalbaar is en gekoppeld is aan de bestaande ERP-, PSP- en
  verzendintegraties.
aanpak: >-
  We kozen voor Magento Open Source met Hyvä: flexibel in maatwerk en
  integraties, zonder onnodige complexiteit. Het project liep in duidelijke
  fases met wekelijkse afstemming en korte lijnen tussen beide teams.
aanpakPunten:
  - Magento Open Source als schaalbare basis
  - Hyvä frontend voor performance en onderhoudsgemak
  - Koppelingen met ERP, PSP en verzending
  - Marketing- en SEO technisch correct ingericht vanaf dag één
resultaat: >-
  De shop ging live vóór de beurs, met een snelle Hyvä frontend en een
  Magento basis die klaar is voor internationale uitbreiding.
