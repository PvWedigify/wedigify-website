uitdaging: >-
  Greenfield Fashion is al meer dan 30 jaar een vertrouwd gezicht, met winkels
  in Waddinxveen en Gouda en meer dan 60 merken. Toch bleef de online groei
  achter. De vraag: hoe verbeteren we organische omzet en conversie zonder
  direct afhankelijk te zijn van betaalde campagnes?
aanpak: >-
  We combineerden SEO en CRO tot een hefboom: meer bezoekers die ook beter
  converteren. Alle verbeteringen werden stapsgewijs uitgerold, gemeten en
  bijgestuurd.
